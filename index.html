<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IBB – Controle de Empréstimos</title>
  <style>
    :root {
      --bg: #f4f5f7; --card: #fff; --tx: #1d2330; --mu: #6b7385; --pr: #1f4e8c; --pt: #fff; --bd: #dfe3ea; --ok: #1b7f4b; --wn: #b45309; --rd: #b42318;
      box-sizing: border-box;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--tx);
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--card); border-bottom:1px solid var(--bd); padding:10px 16px; }
    header h1 { margin:0; flex:1; font-size:17px; }
    header small { color:var(--mu); }
    main { max-width:1100px; margin:0 auto; padding:16px; }
    .card { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:16px; }
    button { font:inherit; border:1px solid var(--bd); background:var(--card); color:var(--tx); border-radius:8px; padding:8px 12px; cursor:pointer; }
    button.p { background:var(--pr); color:var(--pt); border-color:var(--pr); }
    button.on { border-color:var(--pr); color:var(--pr); font-weight:600; }
    button.d { color:var(--rd); }
    input, select { font:inherit; width:100%; padding:9px 10px; border:1px solid var(--bd); border-radius:8px; background:var(--bg); color:var(--tx); }
    label { display:block; margin:10px 0; font-size:13px; color:var(--mu); }
    label input, label select { margin-top:4px; }
    .login { max-width:360px; margin:8vh auto; }
    .login h2 { margin-top:0; }
    .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
    .bar .sp { flex:1; }
    .bar input { width:auto; }
    .tw { overflow-x:auto; }
    table { border-collapse:collapse; width:100%; min-width:640px; }
    th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--bd); vertical-align:top; }
    th { font-size:12px; color:var(--mu); text-transform:uppercase; }
    tr.off td { opacity:.5; }
    .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid currentColor; }
    .ok { color:var(--ok); }
    .wn { color:var(--wn); }
    .rd { color:var(--rd); }
    .mu { color:var(--mu); }
    .row { display:flex; gap:10px; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--bd); }
    .r2 { display:flex; gap:8px; margin:8px 0; }
    textarea { font:inherit; width:100%; padding:9px 10px; border:1px solid var(--bd); border-radius:8px; background:var(--bg); color:var(--tx); resize:vertical; }
    label.opt { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--tx); }
    label.opt input { width:auto; margin:0; }
    .avl { border:1px solid var(--bd); border-left:3px solid var(--rd); border-radius:8px; padding:8px 10px; margin:8px 0; font-size:14px; }
    .chip { display:inline-block; background:var(--bg); border:1px solid var(--bd); border-radius:99px; padding:2px 10px; margin:3px 4px 0 0; font-size:13px; }
    .chip a { cursor:pointer; color:var(--rd); }
    .cart { background:var(--bg); border:1px solid var(--bd); border-radius:8px; padding:8px 10px; margin:8px 0; }
    .sel { background:var(--bg); border:1px solid var(--ok); border-radius:8px; padding:8px; margin-top:8px; }
    .ov { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-start; justify-content:center; padding:5vh 12px; overflow:auto; z-index:20; }
    .md { background:var(--card); border-radius:14px; padding:18px; width:100%; max-width:520px; border:1px solid var(--bd); }
    .md h3 { margin:0 0 6px; padding-right:32px; }
    .md { position:relative; }
    .md button.mx { position:absolute; top:8px; right:8px; border:0; background:none; padding:4px 10px; font-size:22px; line-height:1; color:var(--mu); opacity:.45; }
    .md button.mx:hover, .md button.mx:focus-visible { opacity:.9; }
    .act { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
    .hero { background:var(--pr); color:var(--pt); border-radius:16px; padding:24px 26px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .hero h2 { margin:0; font-size:26px; }
    .hero p { margin:4px 0 0; opacity:.85; }
    .cta { background:var(--pt); color:var(--pr); border:0; font-weight:700; font-size:16px; padding:14px 22px; border-radius:12px; display:flex; gap:10px; align-items:center; }
    .strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); margin:14px 0 22px; background:var(--card); border:1px solid var(--bd); border-radius:14px; }
    .strip div { padding:14px 18px; border-right:1px solid var(--bd); }
    .strip div:last-child { border:0; }
    .strip b { display:block; font-size:28px; }
    .strip span { color:var(--mu); font-size:13px; }
    .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; margin-bottom:24px; }
    .tile { display:flex; gap:14px; align-items:center; text-align:left; padding:16px; border-radius:14px; }
    .tile svg { flex:none; color:var(--pr); background:var(--bg); border-radius:10px; padding:9px; }
    .tile b { display:block; font-size:16px; }
    .tile small { color:var(--mu); }
    .sec { display:flex; justify-content:space-between; align-items:center; margin:0 0 8px; }
    .sec h3 { margin:0; font-size:17px; }
    #tp { position:fixed; z-index:40; max-width:300px; background:var(--card); color:var(--tx); border:1px solid var(--bd); border-radius:8px; padding:8px 10px; box-shadow:0 4px 14px rgba(0,0,0,.25); font-size:13px; pointer-events:none; display:none; }
    @media print {
      header button, .bar, .act, td button, th:last-child, td:last-child { display:none !important; }
      body { background:#fff!important; color:#000!important; }
      .card { background:#fff!important; border:0!important; }
      table, td, th, small, b { color:#000!important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="mo"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <script>
    const appState = {
      users: [], people: [], items: [], loans: [], off: 0,
      user: null,
      db: null,
      auth: null,
      view: 'login',
      tab: 'p',
      cq: '',
      cs: 'a',
      cset: '',
      f: 'hoje',
      a: '',
      b: '',
      aut: [],
      autSet: []
    };
    // Última versão gravada/lida de cada documento: só o que mudou é enviado ao Firestore.
    const saved = new Map();
    const COLLECTIONS = ['users', 'people', 'items', 'loans'];
    let unsubscribers = [];

    const $ = (s) => document.querySelector(s);
    const now = () => Date.now() + appState.off;
    const nid = () => Date.now() * 100 + Math.floor(Math.random() * 100);
    const esc = (s) => String(s ?? '').replace(/[&<>\"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    const dt = (t) => t ? new Date(t).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
    const isAdmin = () => appState.user && appState.user.perfil === 'Admin';
    const lo = (itemId) => appState.loans.find((l) => l.itemId == itemId && !l.dv);
    const plain = (o) => JSON.parse(JSON.stringify(o));
    // Compara setores ignorando maiúsculas, acentos e espaços extras.
    const norm = (s) => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().replace(/\s+/g, ' ').toLowerCase();
    // Pessoa autorizada num item restrito: incluída pelo nome OU pertence a um setor/ministério autorizado.
    const autorizado = (item, p) => !!p && ((item.aut || []).includes(p.id) || (item.autSet || []).some((s) => norm(s) === norm(p.setor)));
    const autorizadosDe = (item) => appState.people.filter((p) => p.ativo && autorizado(item, p));
    // Telefone no formato (xx) 9xxxx-xxxx: a máscara é aplicada enquanto digita.
    const fmtTel = (v) => {
      const d = String(v ?? '').replace(/\D/g, '').slice(0, 11);
      if (!d) return '';
      if (d.length <= 2) return '(' + d;
      if (d.length <= 7) return `(${d.slice(0, 2)}) ${d.slice(2)}`;
      return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
    };
    // Os 8 dígitos depois do 9 não podem ser todos iguais, ex.: (41) 99999-9999 ou (41) 91111-1111.
    const telRepetido = (v) => /^(\d)\1{7}$/.test(String(v ?? '').replace(/\D/g, '').slice(3));
    const telOk = (v) => /^\([1-9]\d\) 9\d{4}-\d{4}$/.test(v) && !telRepetido(v);
    function mascTel(el) { el.value = fmtTel(el.value); }
    const TEL_ATTR = 'type="tel" inputmode="numeric" maxlength="15" placeholder="(xx) 9xxxx-xxxx" oninput="mascTel(this)"';
    const telMsg = (v) => telRepetido(v) && /^\([1-9]\d\) 9\d{4}-\d{4}$/.test(v)
      ? 'Telefone inválido: os 8 dígitos depois do 9 não podem ser todos iguais.'
      : 'Telefone inválido. Use o formato (xx) 9xxxx-xxxx: DDD + celular com 9 dígitos começando por 9.';
    // Avarias ficam no registro de empréstimo (campo av) e são ligadas à pessoa pelo pId.
    const TIPOS_AVARIA = ['Item perdido', 'Devolvido parcialmente', 'Danificado', 'Outro'];
    const avariasDe = (pid) => appState.loans.filter((l) => l.av && l.pId == pid).sort((a, b) => (b.av.t || 0) - (a.av.t || 0));
    const setoresPessoas = () => {
      const m = new Map();
      appState.people.filter((p) => p.ativo && p.setor).forEach((p) => { if (!m.has(norm(p.setor))) m.set(norm(p.setor), p.setor.trim()); });
      return [...m.values()].sort((a, b) => a.localeCompare(b, 'pt-BR'));
    };

    async function saveData() {
      const db = appState.db;
      const writes = [];
      for (const name of COLLECTIONS) {
        if (name === 'users' && !isAdmin()) continue;
        for (const doc of appState[name]) {
          const key = name + '/' + doc.id;
          const json = JSON.stringify(doc);
          if (saved.get(key) !== json) {
            writes.push(db.collection(name).doc(String(doc.id)).set(plain(doc)).then(() => saved.set(key, json)));
          }
        }
      }
      if (isAdmin()) {
        const json = JSON.stringify({ off: appState.off });
        if (saved.get('cfg/main') !== json) writes.push(db.doc('cfg/main').set({ off: appState.off }).then(() => saved.set('cfg/main', json)));
      }
      try {
        await Promise.all(writes);
      } catch (err) {
        console.error('saveData failed', err);
        alert('Não foi possível gravar os dados no Firebase. Verifique sua conexão e tente de novo.');
      }
    }

    function modalOpen() { return !!$('#mo') && $('#mo').innerHTML !== ''; }

    function stopListening() {
      unsubscribers.forEach((u) => u());
      unsubscribers = [];
      saved.clear();
    }

    // Lê os dados e mantém tudo atualizado em tempo real entre os computadores da recepção.
    function startListening() {
      const db = appState.db;
      const ready = [];
      for (const name of COLLECTIONS) {
        ready.push(new Promise((resolve, reject) => {
          unsubscribers.push(db.collection(name).onSnapshot((snap) => {
            appState[name] = snap.docs.map((d) => d.data());
            appState[name].forEach((d) => saved.set(name + '/' + d.id, JSON.stringify(d)));
            if (name === 'users' && appState.user) {
              const me = appState[name].find((u) => u.id === appState.user.id);
              if (me) appState.user = me;
            }
            resolve();
            const typing = document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
            if (appState.user && !modalOpen() && !typing) draw();
          }, reject));
        }));
      }
      ready.push(new Promise((resolve, reject) => {
        unsubscribers.push(db.doc('cfg/main').onSnapshot((d) => {
          appState.off = d.exists ? Number(d.data().off || 0) : 0;
          saved.set('cfg/main', JSON.stringify({ off: appState.off }));
          resolve();
        }, reject));
      }));
      return Promise.all(ready);
    }

    function msg(title, text) {
      $('#app').innerHTML = `<main><div class="card login"><h2>${esc(title)}</h2><p>${esc(text)}</p><button onclick="sair()">Voltar ao login</button></div></main>`;
    }

    async function onLogin(fbUser) {
      if (!fbUser) {
        stopListening();
        appState.user = null;
        appState.view = 'login';
        draw();
        return;
      }
      $('#app').innerHTML = '<main><p class="mu">Carregando…</p></main>';
      try {
        const snap = await appState.db.collection('users').doc(fbUser.uid).get();
        const profile = snap.exists ? snap.data() : null;
        if (!profile || !profile.ativo) {
          return msg('Acesso não liberado', `A conta ${fbUser.email} ainda não foi liberada ou está inativa. Peça a um administrador para liberar seu acesso.`);
        }
        appState.user = profile;
        await startListening();
        appState.view = 'home';
        draw();
      } catch (error) {
        console.error(error);
        msg('Erro ao carregar', 'Não foi possível carregar os dados. Verifique sua conexão e tente de novo.');
      }
    }

    function init() {
      $('#app').innerHTML = '<main><p class="mu">Carregando…</p></main>';
      try {
        if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
        appState.db = firebase.firestore();
        appState.auth = firebase.auth();
        appState.auth.languageCode = 'pt-BR';
        appState.auth.onAuthStateChanged(onLogin);
      } catch (error) {
        console.error(error);
        $('#app').innerHTML = '<main><div class="card login"><h2>Erro ao carregar</h2><p>Não foi possível conectar ao Firebase. Verifique o arquivo firebase-config.js.</p></div></main>';
      }
    }

    function toast(message, bad = false) {
      let node = $('#ts');
      if (!node) {
        node = document.createElement('div');
        node.id = 'ts';
        node.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:90vw;padding:10px 16px;border-radius:10px;color:#fff;z-index:50;font-size:14px';
        document.body.appendChild(node);
      }
      node.style.background = bad ? '#b42318' : '#1b7f4b';
      node.textContent = message;
      node.style.display = 'block';
      clearTimeout(node._t);
      node._t = setTimeout(() => { node.style.display = 'none'; }, bad ? 9000 : 3000);
    }
    window.alert = (message) => toast(message, true);

    function modal(html) { $('#mo').innerHTML = `<div class="ov"><div class="md">${html}</div></div>`; }
    function closeModal() { $('#mo').innerHTML = ''; }
    function go(view) { if (view === 'cfg' && !isAdmin()) return; appState.view = view; draw(); }
    function draw() {
      if (!appState.user) {
        $('#app').innerHTML = `
          <main>
            <div class="card login">
              <h2>IBB – Empréstimos</h2>
              <p class="mu">Controle de chaves, controles e equipamentos da recepção.</p>
              <label>E-mail<input id="lu" type="email" autocomplete="username"></label>
              <label>Senha<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter') entrar()"></label>
              <button class="p" style="width:100%" onclick="entrar()">Entrar</button>
              <p class="mu" style="font-size:12px;display:flex;justify-content:space-between"><a href="#" onclick="esqueci(); return false">Esqueci minha senha</a><a href="#" onclick="ajuda(); return false">Ajuda</a></p>
            </div>
          </main>
        `;
        return;
      }

      const titleMap = { home: 'Home', cad: 'Cadastro', emp: 'Empréstimos', cfg: 'Configurações' };
      const page = titleMap[appState.view];
      let html = `<header><h1>IBB · ${page}</h1><small id="clk"></small><small>${esc(appState.user.nome)} (${appState.user.perfil})</small>${appState.view !== 'home' ? '<button onclick="go(\'home\')">Home</button>' : ''}<button onclick="ajuda()" title="Manual do sistema">❔ Ajuda</button><button onclick="sair()">Sair</button></header><main>`;
      html += appState.view === 'home' ? vHome() : appState.view === 'cad' ? vCad() : appState.view === 'emp' ? vEmp() : vCfg();
      $('#app').innerHTML = html + '</main>';
      tick();
    }
    function tick() { const c = $('#clk'); if (c) c.textContent = dt(now()); }
    setInterval(tick, 20000);

    const AUTH_ERR = {
      'auth/invalid-credential': 'E-mail ou senha inválidos.',
      'auth/invalid-email': 'E-mail inválido.',
      'auth/user-disabled': 'Esta conta foi desativada.',
      'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos e tente de novo.',
      'auth/network-request-failed': 'Sem conexão com a internet.',
      'auth/email-already-in-use': 'Já existe uma conta com este e-mail.',
      'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.'
    };
    const authMsg = (e) => AUTH_ERR[e && e.code] || 'Não foi possível concluir. Tente de novo.';

    async function entrar() {
      const email = $('#lu').value.trim();
      const senha = $('#lp').value;
      if (!email || !senha) return alert('Informe e-mail e senha.');
      try {
        await appState.auth.signInWithEmailAndPassword(email, senha);
      } catch (e) {
        alert(authMsg(e));
      }
    }
    async function esqueci() {
      const email = ($('#lu') && $('#lu').value.trim()) || '';
      if (!email) return alert('Digite seu e-mail no campo acima e clique de novo em "Esqueci minha senha".');
      try {
        await appState.auth.sendPasswordResetEmail(email);
      } catch (e) { /* não revela se o e-mail existe */ }
      toast('Se este e-mail tiver acesso, você receberá um link para criar uma nova senha.');
    }
    // Manual do sistema (ajuda.html) em nova aba.
    function ajuda(secao) { window.open('ajuda.html' + (secao ? '#' + secao : ''), '_blank', 'noopener'); }
    function sair() { closeModal(); appState.auth.signOut(); }

    const IC = {
      key: '<circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3m-3 3 3 3"/>',
      list: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6"/>',
      users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.4c2.2.6 3.5 2.5 3.5 5.6"/>',
      gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/>'
    };
    const svg = (k, n = 26) => `<svg viewBox="0 0 24 24" width="${n}" height="${n}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

    function vHome() {
      const nowDate = new Date(now());
      const h = nowDate.getHours();
      const saudacao = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
      let data = nowDate.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      data = data[0].toUpperCase() + data.slice(1);
      const diaInicio = +new Date(nowDate.getFullYear(), nowDate.getMonth(), nowDate.getDate());
      const pendentes = appState.loans.filter((l) => !l.dv).sort((a, b) => a.out - b.out);
      const itensAtivos = appState.items.filter((i) => i.ativo);
      const disponiveis = itensAtivos.filter((i) => !lo(i.id)).length;
      const hoje = appState.loans.filter((l) => l.out >= diaInicio).length;
      const tile = (view, icon, title, subtitle) => `<button class="tile" onclick="go('${view}')">${svg(icon)}<span><b>${title}</b><small>${subtitle}</small></span></button>`;
      return `
        <section class="hero">
          <div><h2>${saudacao}, ${esc(appState.user.nome.split(' ')[0])}</h2><p>${data}</p></div>
          <button class="cta" onclick="go('emp'); reg()">${svg('key', 22)}Registrar empréstimo</button>
        </section>
        <section class="strip">
          <div><b class="${pendentes.length ? 'wn' : ''}">${pendentes.length}</b><span>Aguardando devolução</span></div>
          <div><b>${hoje}</b><span>Registrados hoje</span></div>
          <div><b>${disponiveis}</b><span>Itens disponíveis de ${itensAtivos.length}</span></div>
        </section>
        <section class="tiles">
          ${tile('emp', 'list', 'Empréstimos', 'Histórico, filtros e exportação')}
          ${tile('cad', 'users', 'Cadastro', 'Pessoas e itens')}
          ${isAdmin() ? tile('cfg', 'gear', 'Configurações', 'Usuários, permissões e horário') : ''}
        </section>
        <div class="sec"><h3>Aguardando devolução</h3>${pendentes.length > 6 ? `<button onclick="appState.f='pend'; go('emp')">Ver todos (${pendentes.length})</button>` : ''}</div>
        <div class="card">
          ${pendentes.slice(0, 6).map((l) => `
            <div class="row">
              <div><b>${esc(l.iDesc)}</b> <small class="mu">${esc(l.iCod)}</small><br><small class="mu">${esc(l.pNome)} · ${esc(l.pSet)}</small></div>
              <div style="text-align:right"><small class="mu">desde ${dt(l.out)}</small><br><button onclick="dev(${l.id})">Devolver</button></div>
            </div>
          `).join('') || '<p class="mu" style="margin:0">Nenhum item pendente. Tudo foi devolvido.</p>'}
        </div>
      `;
    }

    // Lista de setores/ministérios de todas as pessoas (ativas e inativas) para o filtro.
    function setorFiltro() {
      const m = new Map();
      appState.people.filter((p) => p.setor).forEach((p) => { if (!m.has(norm(p.setor))) m.set(norm(p.setor), p.setor.trim()); });
      const lista = [...m.values()].sort((a, b) => a.localeCompare(b, 'pt-BR'));
      if (appState.cset && !lista.some((x) => norm(x) === norm(appState.cset))) appState.cset = '';
      return `<select style="width:auto;max-width:220px" title="Filtrar por setor/ministério" onchange="appState.cset=this.value; draw()"><option value="">Todos os setores</option>${lista.map((x) => `<option value="${esc(x)}" ${norm(x) === norm(appState.cset) ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>`;
    }
    function fq(item) {
      // Filtro de setor/ministério vale só para a lista de pessoas.
      if (appState.tab === 'p' && appState.cset && norm(item.setor) !== norm(appState.cset)) return false;
      return [item.nome, item.tel, item.setor, item.desc, item.cod].join(' ').toLowerCase().includes((appState.cq || '').toLowerCase()) && (appState.cs === 't' || (appState.cs === 'i' ? !item.ativo : !!item.ativo));
    }

    function vCad() {
      const peopleMode = appState.tab === 'p';
      let html = `<div class="bar"><button class="${peopleMode ? 'on' : ''}" onclick="appState.tab='p'; appState.cq=''; draw()">Pessoas</button><button class="${peopleMode ? '' : 'on'}" onclick="appState.tab='i'; appState.cq=''; draw()">Itens</button><span class="sp"></span><input id="cq" placeholder="Pesquisar…" value="${esc(appState.cq)}" style="max-width:240px" oninput="appState.cq=this.value; draw(); const e=$('#cq'); e.focus(); e.setSelectionRange(999,999)">${peopleMode ? setorFiltro() : ''}<select style="width:auto" onchange="appState.cs=this.value; draw()"><option value="a" ${appState.cs === 'a' ? 'selected' : ''}>Ativos</option><option value="i" ${appState.cs === 'i' ? 'selected' : ''}>Inativos</option><option value="t" ${appState.cs === 't' ? 'selected' : ''}>Ativos e inativos</option></select><button onclick="imp()">🖨 Imprimir</button><button class="p" onclick="${peopleMode ? 'pForm()' : 'iForm()'}">＋ Novo</button></div><div class="card tw"><table>`;
      if (peopleMode) {
        html += '<tr><th>Nome<th>Telefone<th>Setor/Ministério<th>Avarias<th>Status<th></tr>' + appState.people.filter(fq).map((p) => { const na = avariasDe(p.id).length; return `<tr class="${p.ativo ? '' : 'off'}"><td>${esc(p.nome)}<td>${esc(p.tel)}<td>${esc(p.setor)}<td>${na ? `<button class="d" onclick="pAv(${p.id})">⚠ ${na}</button>` : '<span class="mu">—</span>'}<td>${p.ativo ? 'Ativo' : 'Inativo'}<td><button onclick="pForm(${p.id})">Editar</button> <button class="d" onclick="tg('people', ${p.id})">${p.ativo ? 'Inativar' : 'Ativar'}</button></tr>`; }).join('');
      } else {
        html += '<tr><th>Descrição<th>Código<th>Setor/Ministério<th>Restrito<th>Status<th></tr>' + appState.items.filter(fq).map((i) => `<tr class="${i.ativo ? '' : 'off'}"><td>${esc(i.desc)}<td>${esc(i.cod)}<td>${esc(i.setor)}<td>${i.restr ? `Sim (${autorizadosDe(i).length} autorizados${(i.autSet || []).length ? ' · setores: ' + i.autSet.map(esc).join(', ') : ''})` : 'Não'}<td>${i.ativo ? 'Ativo' : 'Inativo'}<td><button onclick="iForm(${i.id})">Editar</button> <button class="d" onclick="tg('items', ${i.id})">${i.ativo ? 'Inativar' : 'Ativar'}</button></tr>`).join('');
      }
      return html + '</table>' + ((peopleMode ? appState.people : appState.items).filter(fq).length ? '' : '<p class="mu">Nenhum registro encontrado.</p>') + '</div>';
    }

    function tg(collection, id) {
      const item = appState[collection].find((x) => x.id == id);
      if (collection === 'items' && item.ativo && lo(id)) return alert('Este item está emprestado. Registre a devolução antes de inativar.');
      if (collection === 'users' && item.ativo) {
        if (item.id === appState.user.id) return alert('Você não pode inativar o próprio usuário.');
        if (item.perfil === 'Admin' && appState.users.filter((u) => u.ativo && u.perfil === 'Admin').length < 2) return alert('É preciso manter ao menos um Admin ativo.');
      }
      item.ativo = item.ativo ? 0 : 1;
      saveData();
      draw();
    }

    function pForm(id) {
      const p = appState.people.find((x) => x.id == id) || {};
      modal(`<h3>${id ? 'Editar' : 'Nova'} pessoa</h3><label>Nome<input id="pn" value="${esc(p.nome)}"></label><label>Telefone<input id="pt" ${TEL_ATTR} value="${esc(fmtTel(p.tel))}"></label><label>Setor/Ministério<input id="ps" value="${esc(p.setor)}"></label><div class="act"><button onclick="closeModal()">Cancelar</button><button class="p" onclick="pSave(${id || 0})">Salvar</button></div>`);
    }
    function pSave(id) {
      const nome = $('#pn').value.trim();
      const tel = $('#pt').value.trim();
      const setor = $('#ps').value.trim();
      if (!nome || !tel || !setor) return alert('Preencha nome, telefone e setor/ministério.');
      if (!telOk(tel)) return alert(telMsg(tel));
      if (id) Object.assign(appState.people.find((x) => x.id == id), { nome, tel, setor });
      else appState.people.push({ id: nid(), nome, tel, setor, ativo: 1 });
      saveData(); closeModal(); draw();
    }

    function iForm(id) {
      const item = appState.items.find((x) => x.id == id) || {};
      appState.aut = [...(item.aut || [])];
      appState.autSet = [...(item.autSet || [])];
      modal(`<h3>${id ? 'Editar' : 'Novo'} item</h3><label>Descrição<input id="xd" value="${esc(item.desc)}"></label><label>Código<input id="xc" value="${esc(item.cod)}"></label><label>Setor/Ministério<input id="xs" value="${esc(item.setor)}"></label><label class="opt"><input type="checkbox" id="xr" ${item.restr ? 'checked' : ''} onchange="aR()"> Restrito (somente setores/ministérios ou pessoas autorizadas)</label><div id="ar"></div><div class="act"><button onclick="closeModal()">Cancelar</button><button class="p" onclick="iSave(${id || 0})">Salvar</button></div>`);
      aR();
    }
    function aR() {
      if (!$('#xr').checked) { $('#ar').innerHTML = ''; return; }
      const usados = appState.autSet.map(norm);
      const opcoes = setoresPessoas().filter((x) => !usados.includes(norm(x)));
      const contaSetor = (x) => appState.people.filter((p) => p.ativo && norm(p.setor) === norm(x)).length;
      const pelosSetores = appState.people.filter((p) => p.ativo && usados.includes(norm(p.setor)));
      const avulsas = appState.people.filter((p) => p.ativo && !appState.aut.includes(p.id) && !usados.includes(norm(p.setor)));
      $('#ar').innerHTML = `
        <div style="margin-top:8px"><b>Setores/ministérios autorizados</b>
          <p class="mu" style="font-size:12px;margin:2px 0">Todas as pessoas do setor ficam autorizadas, inclusive as que forem cadastradas depois.</p>
          <div class="r2"><select id="ass"><option value="">Selecionar setor/ministério…</option>${opcoes.map((x) => `<option value="${esc(x)}">${esc(x)} (${contaSetor(x)} ${contaSetor(x) === 1 ? 'pessoa' : 'pessoas'})</option>`).join('')}</select><button onclick="aSA()">Adicionar</button></div>
          <div>${appState.autSet.map((x, i) => `<span class="chip">${esc(x)} (${contaSetor(x)}) <a onclick="aSD(${i})">✕</a></span>`).join('') || '<small class="mu">Nenhum setor autorizado.</small>'}</div>
          ${pelosSetores.length ? `<p class="mu" style="font-size:12px;margin:6px 0 0">Autorizadas pelo setor: ${pelosSetores.map((p) => esc(p.nome)).join(', ')}</p>` : ''}
        </div>
        <div style="margin-top:12px"><b>Pessoas autorizadas individualmente</b>
          <div class="r2"><select id="as"><option value="">Selecionar pessoa autorizada…</option>${avulsas.map((p) => `<option value="${p.id}">${esc(p.nome)} (${esc(p.setor)})</option>`).join('')}</select><button onclick="aA()">Adicionar</button></div>
          <div>${appState.aut.map((a) => { const p = appState.people.find((z) => z.id == a); return `<span class="chip">${esc(p ? p.nome : '?')} <a onclick="aD(${a})">✕</a></span>`; }).join('') || '<small class="mu">Nenhuma pessoa adicionada individualmente.</small>'}</div>
        </div>`;
    }
    function aSA() {
      const v = $('#ass').value;
      if (v && !appState.autSet.map(norm).includes(norm(v))) { appState.autSet.push(v); aR(); }
    }
    function aSD(i) { appState.autSet.splice(i, 1); aR(); }
    function aA() {
      const v = +$('#as').value;
      if (v) { appState.aut.push(v); aR(); }
    }
    function aD(id) { appState.aut = appState.aut.filter((z) => z != id); aR(); }
    function iSave(id) {
      const desc = $('#xd').value.trim();
      const cod = $('#xc').value.trim();
      const setor = $('#xs').value.trim();
      const restr = $('#xr').checked;
      if (!desc || !setor) return alert('Preencha descrição e setor/ministério.');
      if (restr && !appState.aut.length && !appState.autSet.length) return alert('Item restrito precisa de ao menos um setor/ministério ou uma pessoa autorizada.');
      if (cod && appState.items.some((y) => y.id != id && (y.cod || '').toLowerCase() === cod.toLowerCase())) return alert('Já existe um item com este código.');
      const payload = { desc, cod, setor, restr, aut: restr ? [...appState.aut] : [], autSet: restr ? [...appState.autSet] : [] };
      if (id) Object.assign(appState.items.find((y) => y.id == id), payload);
      else appState.items.push({ id: nid(), ativo: 1, ...payload });
      saveData(); closeModal(); draw();
    }

    function inR(l) {
      if (appState.f === 'pend') return !l.dv;
      const today = new Date(now());
      const d0 = +new Date(today.getFullYear(), today.getMonth(), today.getDate());
      let a, b = Infinity;
      if (appState.f === 'hoje') a = d0;
      else if (appState.f === 'semana') a = d0 - ((today.getDay() + 6) % 7) * 864e5;
      else if (appState.f === 'mes') a = +new Date(today.getFullYear(), today.getMonth(), 1);
      else { a = appState.a ? +new Date(appState.a + 'T00:00') : -Infinity; b = appState.b ? +new Date(appState.b + 'T23:59:59') : Infinity; }
      return l.out >= a && l.out <= b;
    }
    const listFiltrada = () => appState.loans.filter(inR).sort((x, y) => y.out - x.out);

    function vEmp() {
      const btn = (k, label) => `<button class="${appState.f === k ? 'on' : ''}" onclick="appState.f='${k}'; draw()">${label}</button>`;
      const lista = listFiltrada();
      return `
        <div class="bar">
          ${btn('hoje', 'Hoje')}${btn('semana', 'Semana')}${btn('mes', 'Mês')}${btn('per', 'Período')}${btn('pend', 'Pendentes de devolução')}
          <span class="sp"></span>
          <button onclick="exp()">⬇ Exportar PDF</button>
          <button class="p" onclick="reg()">Registrar</button>
        </div>
        ${appState.f === 'per' ? `<div class="bar"><label style="margin:0">De <input type="date" value="${appState.a}" onchange="appState.a=this.value; draw()"></label><label style="margin:0">Até <input type="date" value="${appState.b}" onchange="appState.b=this.value; draw()"></label></div>` : ''}
        <div class="card tw"><table><tr><th>Item<th>Pessoa<th>Setor/Ministério<th>Emprestado em<th>Emprestado por<th>Devolvido em<th>Devolução por<th></tr>${lista.map((l) => `<tr><td>${esc(l.iDesc)}<br><small class="mu">${esc(l.iCod)}</small><td>${esc(l.pNome)}<br><small class="mu">${esc(l.pTel)}</small><td>${esc(l.pSet)}<td>${dt(l.out)}<td>${esc(l.userOut || '—')}<td>${l.dv ? dt(l.dv) : '<span class="tag wn">Pendente</span>'}${l.av ? `<br><span class="tag rd">Avaria: ${esc(l.av.tipo)}</span><br><small>${esc(l.av.desc)}</small>` : ''}<td>${l.dv ? esc(l.userIn || '—') : '—'}<td><button onclick="obsE(${l.id})" onmouseenter="tip(this,${l.id})" onmouseleave="tipx()">Obs.${obsList(l).length ? ` (${obsList(l).length})` : ''}</button> ${l.dv ? '' : `<button onclick="dev(${l.id})">Devolver</button>`}${isAdmin() ? ` <button class="d" onclick="exE(${l.id})">Excluir</button>` : ''}</tr>`).join('')}</table>${lista.length ? '' : '<p class="mu">Nenhum registro neste filtro.</p>'}</div>
      `;
    }

    // Exclusão de registros de empréstimo: somente Admin (também garantido pelas regras do Firestore).
    function exE(id) {
      if (!isAdmin()) return;
      const l = appState.loans.find((x) => x.id == id);
      if (!l) return alert('Registro não encontrado.');
      modal(`<h3>Excluir registro de empréstimo?</h3>
        <p><b>${esc(l.iDesc)}</b> <small class="mu">${esc(l.iCod)}</small><br>${esc(l.pNome)} · ${esc(l.pSet)}<br><small class="mu">Emprestado em ${dt(l.out)}${l.dv ? ' · devolvido em ' + dt(l.dv) : ' · ainda não devolvido'}</small></p>
        <p class="mu" style="font-size:13px">O registro será apagado definitivamente e não aparecerá mais em relatórios nem exportações. Esta ação não pode ser desfeita.${l.dv ? '' : ' Como o item não foi devolvido, ele voltará a aparecer como disponível.'}</p>
        <div class="act"><button onclick="closeModal()">Cancelar</button><button class="d" onclick="exS(${l.id})">Excluir definitivamente</button></div>`);
    }
    async function exS(id) {
      if (!isAdmin()) return;
      try {
        await appState.db.collection('loans').doc(String(id)).delete();
        appState.loans = appState.loans.filter((x) => x.id != id);
        saved.delete('loans/' + id);
        closeModal(); draw();
        toast('Registro excluído.');
      } catch (err) {
        console.error(err);
        alert('Não foi possível excluir o registro. Verifique sua conexão e tente de novo.');
      }
    }

    // Registro de empréstimo: a pessoa monta uma lista de itens (carrinho) e depois escolhe quem vai levar.
    function reg(manter) {
      if (!manter) appState.cart = [];
      appState.cart = (appState.cart || []).filter((id) => appState.items.some((i) => i.id == id && i.ativo && !lo(i.id)));
      modal(`<button class="mx" onclick="closeModal()" aria-label="Fechar sem registrar" title="Fechar">×</button><h3>Registrar</h3><input id="q" placeholder="Digite a descrição ou o código do item" autocomplete="off" oninput="rs()"><div id="cart"></div><div id="res"></div>`);
      rc(); rs(); $('#q').focus();
    }
    // Itens já escolhidos para o empréstimo.
    function rc() {
      const itens = appState.cart.map((id) => appState.items.find((i) => i.id == id)).filter(Boolean);
      $('#cart').innerHTML = itens.length ? `<div class="cart"><b>Itens selecionados (${itens.length})</b><div>${itens.map((i) => `<span class="chip">${esc(i.desc)} <small class="mu">${esc(i.cod)}</small>${i.restr ? ' <span class="wn">●</span>' : ''} <a onclick="cartRem(${i.id})" title="Remover">✕</a></span>`).join('')}</div><div class="act" style="margin-top:8px"><button class="p" onclick="emp()">Continuar com ${itens.length} ${itens.length === 1 ? 'item' : 'itens'} →</button></div></div>` : '';
    }
    function cartAdd(id) {
      if (!appState.cart.includes(id)) appState.cart.push(id);
      $('#q').value = ''; rc(); rs(); $('#q').focus();
    }
    function cartRem(id) { appState.cart = appState.cart.filter((x) => x != id); rc(); rs(); }
    function rs() {
      const q = norm($('#q').value);
      // Lista fica oculta até a pessoa digitar algo na busca.
      if (!q) { $('#res').innerHTML = '<p class="mu" style="margin:10px 2px">Digite na busca para encontrar o item.</p>'; return; }
      const list = appState.items.filter((i) => i.ativo && norm(i.desc + ' ' + i.cod).includes(q)).slice(0, 20);
      $('#res').innerHTML = list.map((i) => {
        const itemLoan = lo(i.id);
        return `<div class="row"><div><b>${esc(i.desc)}</b> <small class="mu">${esc(i.cod)} · ${esc(i.setor)}</small>${i.restr ? ' <span class="tag wn">Restrito</span>' : ''}<br>${itemLoan ? `<span class="tag rd">Emprestado a ${esc(itemLoan.pNome)} desde ${dt(itemLoan.out)}</span>` : '<span class="tag ok">Disponível</span>'}</div>${itemLoan ? `<button onclick="dev(${itemLoan.id})">Devolver</button>` : (appState.cart.includes(i.id) ? `<button onclick="cartRem(${i.id})">✓ Adicionado</button>` : `<button class="p" onclick="cartAdd(${i.id})">＋ Adicionar</button>`)}</div>`;
      }).join('') || '<p class="mu">Nenhum item encontrado.</p>';
    }

    // Tela de devolução: devolução normal ou com registro de avaria.
    function dev(id) {
      const l = appState.loans.find((x) => x.id == id);
      if (!l) return alert('Registro não encontrado.');
      if (l.dv) return alert('Este item já foi devolvido.');
      appState.dvId = l.id;
      const ant = avariasDe(l.pId).length;
      modal(`<button class="mx" onclick="closeModal()" aria-label="Fechar sem registrar" title="Fechar">×</button><h3>Devolução: ${esc(l.iDesc)}</h3>
        <p class="mu" style="margin:0 0 8px">${esc(l.iCod)} · ${esc(l.pNome)} (${esc(l.pSet)}) · emprestado em ${dt(l.out)} por ${esc(l.userOut || '—')}</p>
        ${ant ? `<p class="tag rd" style="margin:0 0 8px">Esta pessoa já tem ${ant} ${ant === 1 ? 'avaria registrada' : 'avarias registradas'}</p>` : ''}
        <label class="opt"><input type="radio" name="dvt" value="ok" checked onchange="dvA()"> Devolvido sem problemas</label>
        <label class="opt"><input type="radio" name="dvt" value="av" onchange="dvA()"> Registrar avaria (perdido, devolvido parcialmente, danificado…)</label>
        <div id="dva"></div>
        <div class="act"><button class="p" onclick="devS(${l.id})">Confirmar devolução</button></div>`);
    }
    function dvA() {
      const av = document.querySelector('input[name=dvt]:checked').value === 'av';
      $('#dva').innerHTML = av ? `<label>Tipo de avaria<select id="avt" onchange="dvI()"><option value="">Selecione…</option>${TIPOS_AVARIA.map((t) => `<option>${t}</option>`).join('')}</select></label>
        <label>Descrição da ocorrência<textarea id="avd" rows="3" placeholder="Ex.: devolveu só 2 das 3 chaves do molho"></textarea></label><div id="avi"></div>
        <p class="mu" style="font-size:12px;margin:4px 0">A avaria fica registrada no cadastro de ${esc((appState.loans.find((x) => x.id == appState.dvId) || {}).pNome || 'quem pegou o item')}.</p>` : '';
    }
    function dvI() {
      $('#avi').innerHTML = $('#avt').value === 'Item perdido' ? '<label class="opt"><input type="checkbox" id="avx" checked> Inativar o item (não poderá ser emprestado até ser reposto)</label>' : '';
    }
    function devS(id) {
      const loan = appState.loans.find((x) => x.id == id);
      if (!loan) return alert('Registro não encontrado.');
      if (loan.dv) { closeModal(); return alert('Este item já foi devolvido.'); }
      const comAvaria = (document.querySelector('input[name=dvt]:checked') || {}).value === 'av';
      if (comAvaria) {
        const tipo = $('#avt').value;
        const desc = $('#avd').value.trim();
        if (!tipo) return alert('Selecione o tipo de avaria.');
        if (!desc) return alert('Descreva a ocorrência.');
        loan.av = { tipo, desc, t: now(), u: appState.user.nome };
        if ($('#avx') && $('#avx').checked) {
          const item = appState.items.find((i) => i.id == loan.itemId);
          if (item) item.ativo = 0;
        }
      }
      loan.dv = now();
      loan.userIn = appState.user.nome;
      closeModal();
      draw();
      saveData();
      toast(comAvaria ? 'Devolução registrada com avaria.' : 'Devolução registrada.');
    }
    // Lista das avarias de uma pessoa (aberta pelo cadastro de pessoas).
    function pAv(pid) {
      const p = appState.people.find((x) => x.id == pid);
      const lista = avariasDe(pid);
      modal(`<button class="mx" onclick="closeModal()" aria-label="Fechar" title="Fechar">×</button><h3>Avarias: ${esc(p ? p.nome : '')}</h3>${lista.map((l) => `<div class="avl"><b>${esc(l.av.tipo)}</b> · ${esc(l.iDesc)} <small class="mu">${esc(l.iCod)}</small><br>${esc(l.av.desc)}<br><small class="mu">Emprestado em ${dt(l.out)} · avaria registrada em ${dt(l.av.t)} por ${esc(l.av.u)}</small></div>`).join('') || '<p class="mu">Nenhuma avaria registrada.</p>'}`);
    }

    function emp() {
      const itens = appState.cart.map((id) => appState.items.find((i) => i.id == id)).filter(Boolean);
      if (!itens.length) return alert('Selecione ao menos um item.');
      appState.r = { itens, p: null, np: false };
      const restritos = itens.filter((i) => i.restr);
      modal(`<button class="mx" onclick="closeModal()" aria-label="Fechar sem registrar" title="Fechar">×</button><h3>Emprestar ${itens.length} ${itens.length === 1 ? 'item' : 'itens'}</h3><div class="cart">${itens.map((i) => `<div>${esc(i.desc)} <small class="mu">${esc(i.cod)}</small>${i.restr ? ' <span class="tag wn">Restrito</span>' : ''}</div>`).join('')}</div>${restritos.length ? `<p class="tag wn">${restritos.length === 1 ? 'Há 1 item restrito' : `Há ${restritos.length} itens restritos`}: só aparecem pessoas autorizadas para ${restritos.length === 1 ? 'ele' : 'todos eles'}</p>` : ''}<input id="pq" placeholder="Pessoa (digite o nome)" oninput="ps()"><div id="pr"></div><div id="sl"></div><div id="nf"></div><label>Observação (opcional, vale para todos os itens)<input id="obx"></label><div class="act"><button onclick="reg(true)">Voltar</button><button class="p" onclick="salvar()">Salvar</button></div>`);
      ps(); $('#pq').focus();
    }
    function ps() {
      const q = $('#pq').value.toLowerCase();
      const restritos = appState.r.itens.filter((i) => i.restr);
      let list = appState.people.filter((p) => p.ativo && p.nome.toLowerCase().includes(q));
      if (restritos.length) list = list.filter((p) => restritos.every((i) => autorizado(i, p)));
      $('#pr').innerHTML = list.slice(0, 6).map((p) => `<div class="row"><div>${esc(p.nome)} <small class="mu">${esc(p.setor)} · ${esc(p.tel)}</small>${avariasDe(p.id).length ? ` <span class="tag rd">⚠ ${avariasDe(p.id).length} ${avariasDe(p.id).length === 1 ? 'avaria' : 'avarias'}</span>` : ''}</div><button onclick="ch(${p.id})">Selecionar</button></div>`).join('') + (restritos.length ? (list.length ? '' : `<p class="mu">Nenhuma pessoa autorizada encontrada${restritos.length > 1 ? ' para todos os itens restritos selecionados. Se for o caso, faça empréstimos separados' : '. Este item não pode ser emprestado a outra pessoa'}.</p>`) : `<div class="row"><span class="mu">Não encontrou?</span><button onclick="np()">＋ Cadastrar nova pessoa</button></div>`);
    }
    function ch(id) {
      const pessoa = appState.people.find((x) => x.id == id);
      appState.r.p = pessoa; appState.r.np = false;
      $('#nf').innerHTML = '';
      $('#sl').innerHTML = `<div class="sel">✔ ${esc(pessoa.nome)} · ${esc(pessoa.setor)} · ${esc(pessoa.tel)}</div>`;
    }
    function np() {
      appState.r.p = null; appState.r.np = true;
      $('#sl').innerHTML = '';
      $('#nf').innerHTML = `<label>Nome<input id="nn" value="${esc($('#pq').value)}"></label><label>Telefone<input id="nt" ${TEL_ATTR}></label><label>Setor/Ministério<input id="ns"></label>`;
    }
    function salvar() {
      const itens = appState.r.itens;
      const ocupados = itens.filter((i) => lo(i.id));
      if (ocupados.length) { alert('Já emprestado: ' + ocupados.map((i) => i.desc).join(', ') + '. Remova da lista.'); return reg(true); }
      let pessoa = appState.r.p;
      if (appState.r.np) {
        const nome = $('#nn').value.trim();
        const tel = $('#nt').value.trim();
        const setor = $('#ns').value.trim();
        if (!nome || !tel || !setor) return alert('Preencha nome, telefone e setor/ministério.');
        if (!telOk(tel)) return alert(telMsg(tel));
        pessoa = { id: nid(), nome, tel, setor, ativo: 1 };
      }
      if (!pessoa) return alert('Selecione ou cadastre a pessoa.');
      const semAut = itens.filter((i) => i.restr && !autorizado(i, pessoa));
      if (semAut.length) return alert('Pessoa não autorizada para: ' + semAut.map((i) => i.desc).join(', ') + '.');
      if (appState.r.np) appState.people.push(pessoa);
      const texto = $('#obx').value.trim();
      const out = now();
      const grp = itens.length > 1 ? nid() : 0; // identifica empréstimos feitos juntos
      const usados = new Set(appState.loans.map((l) => l.id));
      itens.forEach((item) => {
        let id = nid(); while (usados.has(id)) id = nid(); usados.add(id);
        const obs = texto ? [{ t: out, u: appState.user.nome, x: texto }] : [];
        appState.loans.push({ id, grp, itemId: item.id, iDesc: item.desc, iCod: item.cod, iSet: item.setor, pId: pessoa.id, pNome: pessoa.nome, pTel: pessoa.tel, pSet: pessoa.setor, out, dv: 0, userOut: appState.user.nome, userIn: '', obs });
      });
      appState.cart = [];
      saveData(); closeModal(); draw();
      toast(itens.length > 1 ? `${itens.length} empréstimos registrados para ${pessoa.nome}.` : 'Empréstimo registrado.');
    }

    function obsList(loan) { return Array.isArray(loan.obs) ? loan.obs : (loan.obs ? [{ t: loan.out, u: loan.userOut, x: loan.obs }] : []); }
    function tip(el, id) {
      const loan = appState.loans.find((x) => x.id == id); if (!loan) return;
      const list = obsList(loan);
      let node = $('#tp'); if (!node) { node = document.createElement('div'); node.id = 'tp'; document.body.appendChild(node); }
      node.innerHTML = list.length ? list.map((o) => `<div style="margin-bottom:6px"><small class="mu">${dt(o.t)} · ${esc(o.u)}</small><br>${esc(o.x)}</div>`).join('') : '<span class="mu">Sem observações.</span>';
      const rect = el.getBoundingClientRect();
      node.style.display = 'block';
      node.style.left = Math.max(8, Math.min(rect.left, innerWidth - node.offsetWidth - 8)) + 'px';
      node.style.top = (rect.bottom + 6 + node.offsetHeight > innerHeight ? Math.max(8, rect.top - 6 - node.offsetHeight) : rect.bottom + 6) + 'px';
    }
    function tipx() { const node = $('#tp'); if (node) node.style.display = 'none'; }
    function obsE(id) {
      tipx();
      const loan = appState.loans.find((x) => x.id == id);
      const list = obsList(loan);
      modal(`<h3>Observações</h3><small class="mu">${esc(loan.iDesc)} · ${esc(loan.pNome)}</small><div style="margin-top:8px">${list.map((o) => `<div class="row" style="display:block"><small class="mu">${dt(o.t)} · ${esc(o.u)}</small><br>${esc(o.x)}</div>`).join('') || '<p class="mu">Nenhuma observação ainda.</p>'}</div><label>Nova observação<input id="obx" placeholder="Digite e clique em Adicionar"></label><div class="act"><button onclick="closeModal()">Fechar</button><button class="p" onclick="obsS(${id})">Adicionar</button></div>`);
      $('#obx').focus();
    }
    function obsS(id) {
      const loan = appState.loans.find((x) => x.id == id);
      const val = $('#obx').value.trim();
      if (!val) return alert('Digite a observação.');
      loan.obs = [...obsList(loan), { t: now(), u: appState.user.nome, x: val }];
      saveData(); closeModal(); draw(); toast('Observação adicionada.');
    }

    // Exportação dos empréstimos em PDF (não editável): gerado no navegador com jsPDF.
    const carregarScript = (src) => new Promise((ok, falha) => {
      if (document.querySelector(`script[src="${src}"]`)) return ok();
      const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = () => falha(new Error(src));
      document.head.appendChild(el);
    });
    async function exp() {
      const lista = listFiltrada();
      if (!lista.length) return alert('Nenhum registro neste filtro para exportar.');
      try {
        await carregarScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
        await carregarScript('https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js');
      } catch (e) {
        return alert('Não foi possível gerar o PDF. Verifique sua conexão e tente de novo.');
      }
      const { jsPDF } = window.jspdf;
      // Senha de proprietário aleatória: o PDF abre normalmente, mas leitores de PDF bloqueiam edição e cópia.
      const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4', encryption: { userPassword: '', ownerPassword: crypto.getRandomValues(new Uint32Array(4)).join('-'), userPermissions: ['print'] } });
      const filtro = { hoje: 'Hoje', semana: 'Semana', mes: 'Mês', per: `Período ${appState.a ? appState.a.split('-').reverse().join('/') : 'início'} a ${appState.b ? appState.b.split('-').reverse().join('/') : 'hoje'}`, pend: 'Pendentes de devolução' }[appState.f];
      doc.setFontSize(14); doc.text('IBB – Controle de Empréstimos', 10, 12);
      doc.setFontSize(9); doc.setTextColor(90);
      doc.text(`Filtro: ${filtro} · ${lista.length} ${lista.length === 1 ? 'registro' : 'registros'} · Emitido em ${dt(now())} por ${appState.user.nome}`, 10, 18);
      doc.setTextColor(0);
      doc.autoTable({
        startY: 22,
        head: [['Item', 'Código', 'Pessoa', 'Telefone', 'Setor/Ministério', 'Emprestado em', 'Emprestado por', 'Devolvido em', 'Devolução por', 'Avaria', 'Observação', 'Status']],
        body: lista.map((l) => [l.iDesc, l.iCod, l.pNome, l.pTel, l.pSet, dt(l.out), l.userOut || '', l.dv ? dt(l.dv) : '', l.dv ? (l.userIn || '') : '', l.av ? `${l.av.tipo}: ${l.av.desc}` : '', obsList(l).map((o) => `${dt(o.t)} ${o.u}: ${o.x}`).join(' | '), l.dv ? (l.av ? 'Devolvido com avaria' : 'Devolvido') : 'Pendente']),
        styles: { fontSize: 7, cellPadding: 1.5, overflow: 'linebreak', valign: 'top' },
        headStyles: { fillColor: [31, 78, 140], textColor: 255, fontSize: 7 },
        alternateRowStyles: { fillColor: [244, 245, 247] },
        margin: { left: 8, right: 8, bottom: 12 },
        didDrawPage: () => {
          const n = doc.internal.getNumberOfPages();
          doc.setFontSize(7); doc.setTextColor(120);
          doc.text(`Página ${n}`, doc.internal.pageSize.getWidth() - 8, doc.internal.pageSize.getHeight() - 5, { align: 'right' });
          doc.setTextColor(0);
        }
      });
      const hoje = new Date(now()).toISOString().slice(0, 10);
      doc.save(`emprestimos-ibb-${hoje}.pdf`);
      toast('PDF gerado.');
    }

    async function imp() {
      const table = $('#app table');
      if (!table) return alert('Nada para imprimir.');
      const clone = table.cloneNode(true);
      clone.querySelectorAll('tr').forEach((r) => { if (r.lastElementChild) r.lastElementChild.remove(); });
      const title = ($('header h1') || {}).textContent || 'Relatório';
      const filterLabel = { hoje: 'Hoje', semana: 'Semana', mes: 'Mês', per: `Período ${appState.a} a ${appState.b}`, pend: 'Pendentes de devolução' }[appState.f];
      const sub = appState.view === 'emp' ? filterLabel + ' · ' : '';
      const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font:13px system-ui,sans-serif;margin:24px;color:#000}h1{font-size:18px;margin:0 0 4px}p{margin:0 0 14px;color:#444}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px;border-bottom:1px solid #bbb;vertical-align:top}th{font-size:11px;text-transform:uppercase}small{color:#555}</style></head><body><h1>${esc(title)}</h1><p>${esc(sub)}Emitido em ${dt(now())}</p>${clone.outerHTML}<script>onload=()=>setTimeout(()=>print(),300)<\/script></body></html>`;
      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'impressao-ibb.html';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
      toast('Arquivo baixado. Abra-o para imprimir.');
    }

    function vCfg() {
      const z = new Date(now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
      return `
        <div class="bar"><h3 style="margin:0">Usuários</h3><span class="sp"></span><button class="p" onclick="uForm()">＋ Novo usuário</button></div>
        <div class="card tw"><table><tr><th>Nome<th>E-mail<th>Perfil<th>Status<th></tr>${appState.users.filter((u) => !u.excluido).map((u) => `<tr class="${u.ativo ? '' : 'off'}"><td>${esc(u.nome)}<td>${esc(u.login)}<td>${esc(u.perfil)}<td>${u.ativo ? 'Ativo' : 'Inativo'}<td><button onclick="uForm('${esc(u.id)}')">Editar</button>${u.id === appState.user.id ? '' : ` <button class="d" onclick="uDelE('${esc(u.id)}')">Excluir</button>`}</tr>`).join('')}</table></div>
        <h3>Data e hora do sistema</h3>
        <div class="card">
          <p class="mu">Hora atual do sistema: <b>${dt(now())}</b>. Os registros de empréstimo e devolução usam este relógio.</p>
          <div class="bar"><input type="datetime-local" id="cdt" value="${z}"><button class="p" onclick="setT()">Aplicar</button><button onclick="appState.off=0; saveData(); draw()">Usar hora do dispositivo</button></div>
        </div>
      `;
    }

    function setT() {
      const v = $('#cdt').value;
      if (!v) return;
      appState.off = new Date(v).getTime() - Date.now();
      saveData();
      draw();
    }

    const adminsAtivos = () => appState.users.filter((x) => x.ativo && !x.excluido && x.perfil === 'Admin');
    // Excluir usuário: some da lista e perde o acesso aos dados na hora (as regras do banco exigem perfil ativo).
    // A conta de login no Firebase Authentication não pode ser apagada pelo navegador; ela fica sem acesso a nada.
    function uDelE(id) {
      const u = appState.users.find((x) => x.id === id);
      if (!u || !isAdmin()) return;
      if (u.id === appState.user.id) return alert('Você não pode excluir o próprio usuário.');
      if (u.perfil === 'Admin' && u.ativo && adminsAtivos().length < 2) return alert('É preciso manter ao menos um Admin.');
      modal(`<button class="mx" onclick="closeModal()" aria-label="Fechar" title="Fechar">×</button><h3>Excluir usuário?</h3><p><b>${esc(u.nome)}</b><br><small class="mu">${esc(u.login)} · ${esc(u.perfil)}</small></p><p class="mu" style="font-size:13px">O usuário sai da lista e perde o acesso ao sistema imediatamente. Os empréstimos que ele registrou continuam com o nome dele.</p><div class="act"><button onclick="closeModal()">Cancelar</button><button class="d" onclick="uDelS('${esc(u.id)}')">Excluir usuário</button></div>`);
    }
    async function uDelS(id) {
      const u = appState.users.find((x) => x.id === id);
      if (!u || !isAdmin() || u.id === appState.user.id) return;
      if (u.perfil === 'Admin' && u.ativo && adminsAtivos().length < 2) return alert('É preciso manter ao menos um Admin.');
      Object.assign(u, { ativo: 0, excluido: 1, excluidoEm: now(), excluidoPor: appState.user.nome });
      await saveData(); closeModal(); draw();
      toast('Usuário excluído.');
    }

    function uForm(id) {
      const user = appState.users.find((x) => x.id === id) || { perfil: 'Recepção' };
      const senhaCampo = id
        ? `<p class="mu" style="font-size:12px">Para trocar a senha, use o botão abaixo: o usuário recebe um link no e-mail para criar uma nova.</p><button onclick="resetSenha('${esc(id)}')">Enviar link de nova senha</button>`
        : '<label>Senha inicial (mínimo 6 caracteres)<input id="up" type="password" autocomplete="new-password"></label>';
      modal(`<h3>${id ? 'Editar' : 'Novo'} usuário</h3><label>Nome<input id="un" value="${esc(user.nome)}"></label><label>E-mail<input id="ul" type="email" value="${esc(user.login)}" ${id ? 'disabled' : ''}></label>${senhaCampo}<label>Perfil<select id="uf"><option ${user.perfil === 'Admin' ? 'selected' : ''}>Admin</option><option ${user.perfil !== 'Admin' ? 'selected' : ''}>Recepção</option></select></label><p class="mu" style="font-size:12px">Admin: tudo, incluindo itens e configurações. Recepção: empréstimos e cadastros (sem Configurações).</p><div class="act"><button onclick="closeModal()">Cancelar</button><button class="p" onclick="uSave('${esc(id || '')}')">Salvar</button></div>`);
    }

    async function resetSenha(id) {
      const user = appState.users.find((x) => x.id === id);
      if (!user) return;
      try {
        await appState.auth.sendPasswordResetEmail(user.login);
        toast('Link de nova senha enviado para ' + user.login + '.');
      } catch (e) {
        alert(authMsg(e));
      }
    }

    // Cria a conta no Firebase Authentication sem desconectar o administrador.
    async function criarConta(email, senha) {
      const sec = firebase.apps.find((a) => a.name === 'cadastro') || firebase.initializeApp(window.FIREBASE_CONFIG, 'cadastro');
      const cred = await sec.auth().createUserWithEmailAndPassword(email, senha);
      const uid = cred.user.uid;
      await sec.auth().signOut();
      return uid;
    }

    async function uSave(id) {
      const nome = $('#un').value.trim();
      const login = $('#ul').value.trim().toLowerCase();
      const perfil = $('#uf').value;
      if (id) {
        if (!nome) return alert('Preencha o nome.');
        const user = appState.users.find((x) => x.id === id);
        if (user.perfil === 'Admin' && perfil !== 'Admin' && adminsAtivos().length < 2) return alert('É preciso manter ao menos um Admin ativo.');
        Object.assign(user, { nome, perfil });
      } else {
        const senha = $('#up').value;
        if (!nome || !login || !senha) return alert('Preencha nome, e-mail e senha.');
        const antigo = appState.users.find((x) => (x.login || '').toLowerCase() === login);
        if (antigo && antigo.ativo && !antigo.excluido) return alert('Este e-mail já está cadastrado.');
        let uid;
        try {
          uid = await criarConta(login, senha);
        } catch (e) {
          if (e && e.code === 'auth/email-already-in-use' && antigo) {
            // Usuário excluído antes: a conta de login ainda existe, então o perfil é reativado.
            Object.assign(antigo, { nome, perfil, ativo: 1, excluido: 0 });
            await saveData();
            try { await appState.auth.sendPasswordResetEmail(login); } catch (er) { /* segue */ }
            closeModal(); draw();
            return toast('Usuário reativado. Ele pode usar a senha antiga ou o link de nova senha enviado para ' + login + '.');
          }
          return alert(authMsg(e));
        }
        if (antigo) {
          try { await appState.db.collection('users').doc(antigo.id).delete(); } catch (er) { console.error(er); }
          appState.users = appState.users.filter((x) => x !== antigo);
        }
        appState.users.push({ id: uid, nome, login, perfil, ativo: 1 });
      }
      await saveData(); closeModal(); draw();
    }

    init();
  </script>
</body>
</html>
